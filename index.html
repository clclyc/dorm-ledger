/* ---- 照片裁剪：选图后先在方框里裁剪，确认后再压缩入库 ---- */
let cropImgEl = null;
let cropNatW = 0, cropNatH = 0;
let cropDispW = 0, cropDispH = 0;
let cropRect = { x: 0, y: 0, w: 0, h: 0 };
let cropDrag = null;
let cropActive = false;
const CROP_MIN = 40;          // 裁剪框最小边长（显示像素）

function paintCropBox() {
  const box = document.querySelector('#crop-mask .crop-box');
  if (!box) return;
  box.style.left = cropRect.x + 'px';
  box.style.top = cropRect.y + 'px';
  box.style.width = cropRect.w + 'px';
  box.style.height = cropRect.h + 'px';
}

function openCrop(img) {
  cropImgEl = img;
  cropNatW = img.naturalWidth || img.width;
  cropNatH = img.naturalHeight || img.height;
  if (!cropNatW || !cropNatH) { toast('图片读取失败，请换一张试试', 'error'); return; }

  const maxW = Math.min(window.innerWidth - 48, 440);
  const maxH = Math.max(140, window.innerHeight - 260);
  const scale = Math.min(maxW / cropNatW, maxH / cropNatH, 2.5);
  cropDispW = Math.max(1, Math.round(cropNatW * scale));
  cropDispH = Math.max(1, Math.round(cropNatH * scale));

  const mask = document.getElementById('crop-mask');
  mask.innerHTML =
    '<div class="crop-panel">' +
      '<div class="crop-head">裁剪照片</div>' +
      '<div class="crop-stage" style="width:' + cropDispW + 'px;height:' + cropDispH + 'px">' +
        '<img class="crop-img" alt="" style="width:' + cropDispW + 'px;height:' + cropDispH + 'px">' +
        '<div class="crop-box">' +
          '<span class="crop-hd" data-crop-dir="nw"></span>' +
          '<span class="crop-hd" data-crop-dir="ne"></span>' +
          '<span class="crop-hd" data-crop-dir="sw"></span>' +
          '<span class="crop-hd" data-crop-dir="se"></span>' +
        '</div>' +
      '</div>' +
      '<p class="crop-tip">拖动方框调整位置，拖动四角缩放</p>' +
      '<div class="crop-actions">' +
        '<button type="button" class="btn" data-crop-cancel>取消</button>' +
        '<button type="button" class="btn btn-primary" data-crop-apply>确定</button>' +
      '</div>' +
    '</div>';
  mask.querySelector('.crop-img').src = img.src;   // 用属性赋值而非拼字符串，避免 dataURL 转义问题
  mask.hidden = false;
  cropActive = true;

  cropRect = {
    x: Math.round(cropDispW * 0.1),
    y: Math.round(cropDispH * 0.1),
    w: Math.round(cropDispW * 0.8),
    h: Math.round(cropDispH * 0.8)
  };
  paintCropBox();
}

function closeCrop() {
  cropActive = false;
  cropDrag = null;
  document.removeEventListener('pointermove', cropPointerMove);
  document.removeEventListener('pointerup', cropPointerUp);
  document.removeEventListener('pointercancel', cropPointerUp);
  document.getElementById('crop-mask').hidden = true;
}

function cropPointerMove(ev) {
  if (!cropDrag) return;
  const dx = ev.clientX - cropDrag.startX;
  const dy = ev.clientY - cropDrag.startY;
  const s = cropDrag.start;
  let x = s.x, y = s.y, w = s.w, h = s.h;

  if (cropDrag.mode === 'move') {
    x = Math.max(0, Math.min(s.x + dx, cropDispW - w));
    y = Math.max(0, Math.min(s.y + dy, cropDispH - h));
  } else {
    const dir = cropDrag.dir;
    if (dir.indexOf('e') !== -1) w = Math.max(CROP_MIN, Math.min(s.w + dx, cropDispW - s.x));
    if (dir.indexOf('s') !== -1) h = Math.max(CROP_MIN, Math.min(s.h + dy, cropDispH - s.y));
    if (dir.indexOf('w') !== -1) {
      x = Math.max(0, Math.min(s.x + dx, s.x + s.w - CROP_MIN));
      w = s.x + s.w - x;
    }
    if (dir.indexOf('n') !== -1) {
      y = Math.max(0, Math.min(s.y + dy, s.y + s.h - CROP_MIN));
      h = s.y + s.h - y;
    }
  }
  cropRect = { x: x, y: y, w: w, h: h };
  paintCropBox();
}

function cropPointerUp() {
  cropDrag = null;
  document.removeEventListener('pointermove', cropPointerMove);
  document.removeEventListener('pointerup', cropPointerUp);
  document.removeEventListener('pointercancel', cropPointerUp);
}

/** 把显示坐标换算回原图像素，裁出该区域并压缩入库 */
function applyCrop() {
  if (!cropImgEl) { photoSlotTarget = null; closeCrop(); return; }
  const target = photoSlotTarget;
  const img = cropImgEl;
  const k = cropNatW / cropDispW;          // 显示等比缩放，x/y 共用一个比例
  let sx = Math.round(cropRect.x * k);
  let sy = Math.round(cropRect.y * k);
  let sw = Math.round(cropRect.w * k);
  let sh = Math.round(cropRect.h * k);
  sx = Math.max(0, Math.min(sx, cropNatW - 1));
  sy = Math.max(0, Math.min(sy, cropNatH - 1));
  sw = Math.max(1, Math.min(sw, cropNatW - sx));
  sh = Math.max(1, Math.min(sh, cropNatH - sy));

  photoSlotTarget = null;
  closeCrop();
  cropToDataUrl(img, sx, sy, sw, sh, function (dataUrl) {
    if (!dataUrl) { toast('图片处理失败，请换一张试试', 'error'); return; }
    commitPhoto(target, dataUrl);
  });
}

/** 把裁好的照片写回成员数据，并刷新弹层 */
function commitPhoto(target, dataUrl) {
  if (!target) return;
  const m = memberById(target.memberId);
  if (!m) return;
  if (!Array.isArray(m.photos)) m.photos = [];
  m.photos[target.index] = dataUrl;
  save();
  if (openPhotoMemberId === target.memberId) {
    renderPhotoPopover();
    positionPhotoPopover();
  }
  toast('照片已保存', 'success');
}

/** 打开系统相册 / 文件选择，为指定成员的第 index 个槽位选图 */
function pickPhotoFor(memberId, index) {
  photoSlotTarget = { memberId: memberId, index: index };
  const fileInput = document.getElementById('photo-file');
  fileInput.value = '';       // 清空以便重复选择同一张图
  fileInput.click();
}

/**
 * 生成「给人看」的纯文字账单，用于一键复制到微信 / 记事本 / 备忘录。
 * 与 JSON 备份的分工：JSON 供程序导入恢复（含 id、分类 key 等机器信息），
 * 这里只追求人一眼能读懂，所以是纯文本、无任何转义字符。
 */
function buildBillText() {
  const stats = computeStats();
  const transfers = computeTransfers(stats.balance);
  const lines = [];

  let settledTotal = 0;
  let settledCount = 0;
  state.expenses.forEach(e => { if (e.settled) { settledTotal += e.amountCents; settledCount++; } });

  lines.push('【宿舍账本】账单');
  lines.push('待结清总额：' + fmt(stats.totalCents) + (settledTotal > 0 ? '（另有已结清 ' + fmt(settledTotal) + '）' : ''));
  lines.push('');

  // 一、成员结算（当前待结清）
  lines.push('一、成员结算（当前待结清）');
  state.members.forEach(m => {
    const b = stats.balance[m.id];
    let balanceText = '已结清';
    if (b > 0) balanceText = '应收 ' + fmt(b);
    else if (b < 0) balanceText = '应付 ' + fmt(-b);
    lines.push('  ' + m.name + '：垫付 ' + fmt(stats.paid[m.id]) +
      '，应分摊 ' + fmt(stats.share[m.id]) + '，' + balanceText);
  });
  lines.push('');

  // 二、转账方案
  lines.push('二、转账方案（' + transfers.length + ' 笔）');
  if (transfers.length === 0) {
    lines.push('  账目已结清，无需转账');
  } else {
    transfers.forEach((t, i) => {
      lines.push('  ' + (i + 1) + '. ' + nameOf(t.from) + ' 转给 ' + nameOf(t.to) + ' ' + fmt(t.amt));
    });
  }
  lines.push('');

  // 三、支出明细（与页面一致的排序：日期倒序，同日期按录入时间倒序）
  lines.push('三、支出明细（共 ' + state.expenses.length + ' 笔' + (settledCount > 0 ? '，其中已结清 ' + settledCount + ' 笔' : '') + '）');
  if (state.expenses.length === 0) {
    lines.push('  暂无支出记录');
  } else {
    const sorted = state.expenses.slice().sort((a, b) =>
      b.date.localeCompare(a.date) || (b.createdAt - a.createdAt)
    );
    sorted.forEach((e, i) => {
      const cat = CATEGORIES.find(c => c.key === e.category) || CATEGORIES[CATEGORIES.length - 1];
      const isAll = e.participantIds.length === state.members.length;
      const partText = isAll ? '全体成员' : e.participantIds.map(nameOf).join('、');
      lines.push('  ' + (i + 1) + '. ' + e.date + ' [' + cat.label + '] ' + e.title +
        ' ' + fmt(e.amountCents) + ' ｜付款：' + nameOf(e.payerId) + ' ｜分摊：' + partText +
        (e.settled ? ' ｜已结清' : ''));
    });
  }
  lines.push('');
  lines.push('生成时间：' + new Date().toLocaleString('zh-CN', { hour12: false }));

  return lines.join('\n');
}

/** 刷新所有依赖数据的区域 */
function refresh() {
  renderMembers();
  renderStats();
  renderSettlement();
  renderExpenseList();
  // 照片弹层跟随数据刷新：成员还在就重绘并重新定位，否则收起
  if (openPhotoMemberId) {
    if (memberById(openPhotoMemberId)) { renderPhotoPopover(); positionPhotoPopover(); }
    else { closePhotoPopover(); }
  }
}

/* ---------------------------------------------------------------------
 * 6. 事件绑定与初始化
 * ------------------------------------------------------------------- */

/** 把人数写入输入框并触发原有的 change 校验流程（步进器与手输共用同一套规则） */
function setLimitValue(value) {
  const input = document.getElementById('member-limit');
  input.value = String(value);
  input.dispatchEvent(new Event('change', { bubbles: true }));
}

/** 步进器：− / + */
document.getElementById('limit-minus').addEventListener('click', function () {
  if (state.memberLimit <= 0) { setLimitValue(MIN_MEMBER_LIMIT); return; }
  setLimitValue(state.memberLimit - 1);
});
document.getElementById('limit-plus').addEventListener('click', function () {
  if (state.memberLimit <= 0) { setLimitValue(DEFAULT_MEMBER_LIMIT); return; }
  setLimitValue(state.memberLimit + 1);
});

/** 设置 / 修改宿舍人数（即成员上限） */
document.getElementById('member-limit').addEventListener('change', function () {
  const raw = this.value.trim();
  const next = parseInt(raw, 10);

  // 清空输入 = 放弃修改，保持原值
  if (raw === '') { revertLimitInput(); renderMembers(); return; }

  if (!/^\d+$/.test(raw) || next < MIN_MEMBER_LIMIT || next > MAX_MEMBER_LIMIT) {
    toast('宿舍人数请填 ' + MIN_MEMBER_LIMIT + '~' + MAX_MEMBER_LIMIT + ' 之间的整数', 'error');
    revertLimitInput(); renderMembers(); return;
  }
  // 不允许小于已有成员数：那等同于凭空删人，会让历史账目失去支撑
  if (next < state.members.length) {
    toast('已有 ' + state.members.length + ' 位成员，人数不能改成 ' + next, 'error');
    revertLimitInput(); renderMembers(); return;
  }
  if (next === state.memberLimit) { revertLimitInput(); renderMembers(); return; }

  state.memberLimit = next;
  save();
  renderMembers();
  toast('宿舍人数已设为 ' + next + ' 人', 'success');
});

/** 添加成员 */
document.getElementById('member-form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  const input = document.getElementById('member-name');
  const name = input.value.trim();

  if (state.memberLimit <= 0) { toast('请先设置宿舍人数', 'error'); return; }
  if (!name) { toast('请输入成员姓名', 'error'); return; }
  if (state.members.length >= state.memberLimit) {
    toast('成员已达设定人数（' + state.memberLimit + ' 人）', 'error');
    return;
  }
  if (state.members.some(m => m.name.toLowerCase() === name.toLowerCase())) { toast('该成员已存在', 'error'); return; }

  state.members.push({ id: uid(), name: name.slice(0, 12) });
  input.value = '';
  save();
  resetExpenseForm();
  refresh();
  toast('已添加成员「' + name + '」', 'success');
});

/** 删除成员（有支出关联时禁止删除） */
document.getElementById('member-list').addEventListener('click', function (ev) {
  // 点姓名 -> 展开 / 收起照片弹层
  const openBtn = ev.target.closest('[data-photo-member]');
  if (openBtn) {
    const openId = openBtn.getAttribute('data-photo-member');
    if (openPhotoMemberId === openId) closePhotoPopover();
    else openPhotoPopover(openId);
    return;
  }

  const btn = ev.target.closest('[data-del-member]');
  if (!btn) return;

  const id = btn.getAttribute('data-del-member');
  const member = state.members.find(m => m.id === id);
  if (!member) return;

  const used = state.expenses.some(e => e.payerId === id || e.participantIds.indexOf(id) !== -1);
  if (used) {
    toast('「' + member.name + '」已有支出记录，无法删除', 'error');
    return;
  }
  if (!confirm('确定删除成员「' + member.name + '」吗？')) return;

  state.members = state.members.filter(m => m.id !== id);
  if (openPhotoMemberId === id) closePhotoPopover();
  save();
  resetExpenseForm();
  refresh();
  toast('已删除成员', 'success');
});

/** 付款人标签单选 -> 同步回原生 select（select 始终是唯一取值来源） */
document.getElementById('exp-payer-tags').addEventListener('change', function (ev) {
  const radio = ev.target.closest('input[type="radio"]');
  if (!radio) return;
  document.getElementById('exp-payer').value = radio.value;
  syncTagStates();
});

/** 参与分摊标签多选：点选后刷新选中态样式 */
document.getElementById('exp-participants').addEventListener('change', function (ev) {
  if (!ev.target.closest('input[type="checkbox"]')) return;
  syncTagStates();
});

/** 添加支出 */
document.getElementById('expense-form').addEventListener('submit', function (ev) {
  ev.preventDefault();

  if (state.members.length === 0) { toast('请先添加宿舍成员', 'error'); return; }

  const title = document.getElementById('exp-title').value.trim();
  const amountRaw = document.getElementById('exp-amount').value.trim();
  const date = document.getElementById('exp-date').value || todayStr();
  const payerId = document.getElementById('exp-payer').value;
  const category = document.getElementById('exp-category').value;
  const participantIds = Array.prototype.slice
    .call(document.querySelectorAll('#exp-participants input:checked'))
    .map(input => input.value);

  if (!title) { toast('请填写支出事项', 'error'); return; }

  const amountCents = parseYuanToCents(amountRaw);
  if (amountCents === null) { toast('请输入正确的金额（大于 0，最多两位小数）', 'error'); return; }

  if (!payerId) { toast('请选择付款人', 'error'); return; }
  if (participantIds.length === 0) { toast('请至少选择一位参与分摊的成员', 'error'); return; }

  state.expenses.push({
    id: uid(),
    title: title.slice(0, 30),
    amountCents: amountCents,
    payerId: payerId,
    participantIds: participantIds,
    date: date,
    category: category,
    settled: false,
    createdAt: Date.now()
  });

  save();
  resetExpenseForm();
  refresh();
  toast('已添加支出', 'success');
});

/** 参与分摊：全选 / 全不选 */
function setAllParticipants(checked) {
  Array.prototype.forEach.call(
    document.querySelectorAll('#exp-participants input'),
    input => { input.checked = checked; }
  );
  syncTagStates();
}
document.getElementById('btn-select-all').addEventListener('click', function () { setAllParticipants(true); });
document.getElementById('btn-select-none').addEventListener('click', function () { setAllParticipants(false); });

/** 删除支出记录 / 结清 · 撤销结清 */
document.getElementById('expense-list').addEventListener('click', function (ev) {
  // 结清 / 撤销结清：账单保留在列表中，结清后不再计入当前账目
  const settleBtn = ev.target.closest('[data-settle-expense]');
  if (settleBtn) {
    const sid = settleBtn.getAttribute('data-settle-expense');
    const item = state.expenses.find(e => e.id === sid);
    if (!item) return;
    item.settled = !item.settled;
    save();
    refresh();
    toast(item.settled ? '已标记为「已结清」，不再计入当前账目' : '已撤销结清，该笔重新计入当前账目', 'success');
    return;
  }

  const btn = ev.target.closest('[data-del-expense]');
  if (!btn) return;

  const id = btn.getAttribute('data-del-expense');
  const expense = state.expenses.find(e => e.id === id);
  if (!expense) return;
  if (!confirm('确定删除支出「' + expense.title + '」吗？')) return;

  state.expenses = state.expenses.filter(e => e.id !== id);
  save();
  refresh();
  toast('已删除该条支出', 'success');
});

/* ---- 成员照片：槽位点击 / 移除 / 选图回调 ---- */
document.getElementById('photo-pop').addEventListener('click', function (ev) {
  // 移除某张照片
  const rm = ev.target.closest('[data-photo-remove]');
  if (rm) {
    const idx = parseInt(rm.getAttribute('data-photo-remove'), 10);
    const m = openPhotoMemberId ? memberById(openPhotoMemberId) : null;
    if (m && Array.isArray(m.photos)) {
      m.photos[idx] = null;
      save();
      renderPhotoPopover();
      positionPhotoPopover();
      toast('已移除照片', 'success');
    }
    return;
  }
  // 点槽位：空槽 -> 选图并裁剪；已有照片 -> 放大查看
  const slot = ev.target.closest('[data-photo-slot]');
  if (slot) {
    const idx = parseInt(slot.getAttribute('data-photo-slot'), 10);
    const m = openPhotoMemberId ? memberById(openPhotoMemberId) : null;
    if (m && Array.isArray(m.photos) && m.photos[idx]) {
      openPhotoView(idx);
    } else {
      pickPhotoFor(openPhotoMemberId, idx);
    }
  }
});

/* ---- 照片查看层：关闭 / 更换 / 移除 ---- */
document.getElementById('photo-view').addEventListener('click', function (ev) {
  if (ev.target.closest('[data-view-close]')) { closePhotoView(); return; }

  if (ev.target.closest('[data-view-replace]')) {
    const idx = photoViewIndex;
    const memberId = openPhotoMemberId;
    closePhotoView();
    pickPhotoFor(memberId, idx);      // 换图同样走「选图 -> 裁剪」流程
    return;
  }

  if (ev.target.closest('[data-view-remove]')) {
    const m = openPhotoMemberId ? memberById(openPhotoMemberId) : null;
    if (m && Array.isArray(m.photos) && photoViewIndex !== null) {
      m.photos[photoViewIndex] = null;
      save();
      renderPhotoPopover();
      positionPhotoPopover();
      toast('已移除照片', 'success');
    }
    closePhotoView();
    return;
  }

  // 点面板外的遮罩区域关闭
  if (!ev.target.closest('.photo-view-panel')) closePhotoView();
});

/* ---- 裁剪层：取消 / 确定 / 拖动方框与四角缩放 ---- */
document.getElementById('crop-mask').addEventListener('click', function (ev) {
  if (ev.target.closest('[data-crop-cancel]')) { photoSlotTarget = null; closeCrop(); return; }
  if (ev.target.closest('[data-crop-apply]')) { applyCrop(); return; }
});
document.getElementById('crop-mask').addEventListener('pointerdown', function (ev) {
  const box = ev.target.closest('.crop-box');
  if (!box) return;
  ev.preventDefault();
  const handle = ev.target.closest('[data-crop-dir]');
  cropDrag = {
    mode: handle ? 'resize' : 'move',
    dir: handle ? handle.getAttribute('data-crop-dir') : 'move',
    startX: ev.clientX,
    startY: ev.clientY,
    start: { x: cropRect.x, y: cropRect.y, w: cropRect.w, h: cropRect.h }
  };
  document.addEventListener('pointermove', cropPointerMove);
  document.addEventListener('pointerup', cropPointerUp);
  document.addEventListener('pointercancel', cropPointerUp);
});

document.getElementById('photo-file').addEventListener('change', function (ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file || !photoSlotTarget) return;

  // 选完图先进入裁剪层；用户确认裁剪后才压缩入库
  readImageFile(file, function (img) {
    if (!img) { photoSlotTarget = null; toast('图片读取失败，请换一张试试', 'error'); return; }
    openCrop(img);
  });
});

/** 点击弹层外 / 按 Esc 收起照片弹层（放大层 / 裁剪层打开时不收起） */
document.addEventListener('click', function (ev) {
  if (!openPhotoMemberId) return;
  if (ev.target.closest('#crop-mask')) return;
  if (ev.target.closest('#photo-view')) return;
  if (ev.target.closest('#photo-pop')) return;
  if (ev.target.closest('[data-photo-member]')) return;   // 姓名按钮由上面的 handler 处理
  closePhotoPopover();
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (cropActive) { photoSlotTarget = null; closeCrop(); return; }   // 裁剪层在最上层，优先响应
  if (viewActive) { closePhotoView(); return; }
  if (openPhotoMemberId) closePhotoPopover();
});
window.addEventListener('resize', positionPhotoPopover);
window.addEventListener('scroll', positionPhotoPopover, true);

/** 复制结算方案（便于直接发到宿舍群） */
document.getElementById('btn-copy-settlement').addEventListener('click', function () {
  const transfers = computeTransfers(computeStats().balance);
  if (transfers.length === 0) { toast('当前无需转账', 'info'); return; }

  const text = '【宿舍账本】结算方案\n' +
    transfers.map(t => nameOf(t.from) + ' 转给 ' + nameOf(t.to) + ' ' + fmt(t.amt)).join('\n');

  copyText(text)
    .then(() => toast('结算方案已复制', 'success'))
    .catch(() => toast('复制失败，请手动选择文本', 'error'));
});

/** 复制整份文字账单（给人看，可直接粘贴到微信 / 记事本） */
document.getElementById('btn-copy-bill').addEventListener('click', function () {
  if (state.members.length === 0 && state.expenses.length === 0) {
    toast('当前没有数据可复制', 'info');
    return;
  }
  copyText(buildBillText())
    .then(() => toast('账单已复制，可直接粘贴到微信 / 记事本', 'success'))
    .catch(() => toast('复制失败，请手动选择文本', 'error'));
});

/** 导出 / 导入 / 清空 */
document.getElementById('btn-export').addEventListener('click', exportJSON);
document.getElementById('btn-import').addEventListener('click', function () {
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', function (ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';           // 允许重复选择同一个文件
  if (file) importJSON(file);
});
document.getElementById('btn-clear').addEventListener('click', function () {
  if (state.members.length === 0 && state.expenses.length === 0 && state.memberLimit === 0) { toast('当前没有数据', 'info'); return; }
  if (!confirm('确定清空所有成员和支出记录吗？此操作不可撤销，建议先导出备份。')) return;
  state = { memberLimit: 0, members: [], expenses: [] };
  save();
  resetExpenseForm();
  refresh();
  toast('已清空所有数据', 'success');
});

/** 初始化 */
(function init() {
  // 分类下拉
  document.getElementById('exp-category').innerHTML = CATEGORIES.map((c, i) =>
    '<option value="' + c.key + '"' + (i === 0 ? ' selected' : '') + '>' + c.label + '</option>'
  ).join('');

  load();               // 读取本地数据
  resetExpenseForm();   // 表单默认值（日期 = 今天，参与人 = 全选）
  refresh();            // 首屏渲染
})();
</script>

<!-- =====================================================================
     Android WebView 原生桥接层（仅在 Android 壳中生效）
     · 普通浏览器 / file:// 双击打开时：window.AndroidBridge 不存在，整段脚本直接空跑，
       网页行为与原来完全一致。
     · Android 壳中：只接管「导出文件的落盘姿势」「剪贴板」「安全区/键盘尺寸传递」，
       不修改任何业务函数、计算规则、数据结构与导出 JSON 结构。
     ===================================================================== -->
<script>
(function () {
  if (!window.AndroidBridge) return;   // 非 Android 环境：直接跳过

  /* ---- 1) 导出：把 <a download> + blob 交给原生保存并分享 ----
     网页原逻辑：URL.createObjectURL(blob) → <a download> 点击。
     这里记住 url→blob 映射，并在 <a download> 被点击时改为把内容交给原生。 */
  var _createObjectURL = URL.createObjectURL;
  var _revokeObjectURL = URL.revokeObjectURL;
  var _blobMap = {};

  URL.createObjectURL = function (obj) {
    var url = _createObjectURL.call(URL, obj);
    try {
      if (Object.prototype.toString.call(obj) === '[object Blob]') _blobMap[url] = obj;
    } catch (e) {}
    return url;
  };

  URL.revokeObjectURL = function (url) {
    try { delete _blobMap[url]; } catch (e) {}
    return _revokeObjectURL.call(URL, url);
  };

  var _anchorClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    try {
      var name = this.getAttribute('download');
      var href = this.getAttribute('href') || '';
      if (name && _blobMap[href] && AndroidBridge.saveBlob) {
        var reader = new FileReader();
        reader.onload = function () {
          var result = String(reader.result);
          var comma = result.indexOf(',');
          var meta = result.slice(0, comma);
          var base64 = result.slice(comma + 1);
          var matched = meta.match(/data:([^;]*)/);
          var mime = (matched && matched[1]) ? matched[1] : 'application/octet-stream';
          try { AndroidBridge.saveBlob(name, mime, base64); } catch (e) {}
        };
        reader.readAsDataURL(_blobMap[href]);
        return;   // 阻止 WebView 里注定失败的默认下载
      }
    } catch (e) {}
    return _anchorClick.apply(this, arguments);
  };

  /* ---- 2) 剪贴板：file:// 属于非安全上下文，navigator.clipboard 常不存在，改用原生 ---- */
  if (!navigator.clipboard || !navigator.clipboard.writeText) {
    try {
      Object.defineProperty(navigator, 'clipboard', {
        configurable: true,
        value: {
          writeText: function (text) {
            return new Promise(function (resolve, reject) {
              try { AndroidBridge.copyText(String(text)); resolve(); }
              catch (e) { reject(e); }
            });
          }
        }
      });
    } catch (e) {}
  }

  /* ---- 3) 安全区 / 键盘：由原生侧调用，把尺寸写入 CSS 变量 ---- */
  window.__applyInsets = function (insets) {
    if (!insets) return;
    var root = document.documentElement;
    if (typeof insets.top === 'number') root.style.setProperty('--sat', insets.top + 'px');
    if (typeof insets.bottom === 'number') root.style.setProperty('--sab', insets.bottom + 'px');
    if (typeof insets.ime === 'number') root.style.setProperty('--kb', insets.ime + 'px');
    root.classList.toggle('kb-open', !!insets.imeVisible);

    // 刻意不做任何 scrollIntoView：
    // 原生侧已按键盘高度收窄了 WebView，Chromium 会把聚焦的输入框自动滚到键盘上方，
    // 这里再手动滚动会与浏览器原生滚动叠加，导致「整体上滑过多」。
  };

  /* ---- 4) 返回键支持：由原生侧询问「是否有弹层打开」/ 「关闭最上层弹层」 ---- */
  window.__hasOverlay = function () {
    return !!(document.querySelector('#crop-mask:not([hidden])') ||
              document.querySelector('#photo-view:not([hidden])') ||
              document.querySelector('#photo-pop:not([hidden])'));
  };

  window.__nativeBack = function () {
    // 网页自身已有「按 Esc 逐层关闭弹层（裁剪层 > 放大层 > 照片气泡）」的逻辑，
    // 这里派发一个 Esc 键事件即可复用，无需改动业务代码。
    var evt = new KeyboardEvent('keydown', {
      key: 'Escape', code: 'Escape', keyCode: 27, which: 27, bubbles: true
    });
    document.dispatchEvent(evt);
    return true;
  };
})();
</script>
