apply plugin: 'com.android.application'

android {
    namespace 'com.dorm.ledger'
    compileSdk 34

    defaultConfig {
        applicationId "com.dorm.ledger"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // assets 里的 html 不压缩，保持与网页端逐字节一致
    androidResources {
        noCompress 'html', 'json'
    }
}

// Kotlin 1.8+ 已把 jdk7 / jdk8 扩展类合并进 kotlin-stdlib 主包，
// 这里排除旧版拆分件，避免依赖树里出现重复类（无需额外下载，离线可构建）
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // 仅使用本机已缓存的 AndroidX 版本，构建无需联网
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}